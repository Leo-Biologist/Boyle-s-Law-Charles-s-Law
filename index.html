<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <title>기체 입자 시뮬레이션</title> <style> body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; } canvas { background-color: #000; border: 2px solid #333; } </style> </head> <body> <canvas id="particleCanvas"></canvas> <script> const canvas = document.getElementById('particleCanvas'); const ctx = canvas.getContext('2d'); // 설정값 (원하시는 대로 수정 가능) canvas.width = 600; canvas.height = 400; const particles = []; const particleCount = 40; const temperature = 300; // 온도 const color = '#00ff00'; // 입자 색상 // 초기 입자 생성 for (let i = 0; i < particleCount; i++) { particles.push({ x: 10 + Math.random() * (canvas.width - 20), y: 10 + Math.random() * (canvas.height - 20), vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 }); } function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); const speedMultiplier = Math.sqrt(temperature / 300); particles.forEach(p => { // 위치 이동 p.x += p.vx * speedMultiplier; p.y += p.vy * speedMultiplier; // 벽 충돌 처리 (x축) if (p.x <= 5 || p.x >= canvas.width - 5) p.vx *= -1; // 벽 충돌 처리 (y축) if (p.y <= 5 || p.y >= canvas.height - 5) p.vy *= -1; // 입자 그리기 ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1; ctx.stroke(); }); requestAnimationFrame(animate); } animate(); </script> </body> </html>
